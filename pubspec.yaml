name: brasis
description: Uma aventura cultural pelas cinco regiões do Brasil.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  go_router: 16.3.0
  supabase_flutter: 2.18.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 400
        - asset: assets/fonts/Nunito.ttf
          weight: 700
        - asset: assets/fonts/Nunito.ttf
          weight: 800
        - asset: assets/fonts/Nunito.ttf
          weight: 900
